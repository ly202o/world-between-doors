<style>.title,#reportBtn,.bar,.fp-hud,.touch-pad,#menu{display:none!important}#sceneCredit{position:fixed;left:18px;bottom:12px;color:#fffb;font:10px system-ui;pointer-events:auto}#sceneCredit a{color:inherit}#sceneExit{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);padding:10px 18px;background:#152a24bb;color:#fff;border:1px solid #fff5;border-radius:4px}#sceneExit[hidden]{display:none}</style>
<div id="sceneCredit">哈特诺风车山谷 · Built with <a href="https://github.com/ssochi/land" target="_blank" rel="noopener">land</a></div><button id="sceneExit" hidden>E　返回原野</button>
<script>
(function(){var ready=false,avatar=null,near=false,clock=performance.now();function exit(){parent.postMessage({type:'land-exit'},'*');}document.getElementById('sceneExit').onclick=exit;
function begin(){if(!ready)return;mapEditor.pause(false);mapEditor.orbit();mapEditor.debug.controls.enabled=false;parent.__world.landControlBegin({heightAt:mapEditor.heightAt,obstacles:mapEditor.obstacles()});clock=performance.now();}
window.addEventListener('message',function(e){if(e.source!==parent)return;if(e.data.type==='land-resume')begin();if(e.data.type==='land-pause')mapEditor.pause(true);});
window.__landSceneFrame=function(){if(!ready||!parent.__landSceneActive)return;var now=performance.now(),dt=Math.min(.1,(now-clock)/1000);clock=now;var state=parent.__world.landControlFrame(dt),T=window.__landThree;if(!avatar){avatar=new T.ObjectLoader().parse(parent.__world.landAvatarData());avatar.traverse(function(o){if(o.isMesh){o.visible=true;o.castShadow=true;o.frustumCulled=false;}});var hemi=new T.HemisphereLight(0xe9f4ff,0x82925c,1.1),sun=new T.DirectionalLight(0xffedcf,1.5);sun.position.set(-20,45,20);mapEditor.debug.scene.add(avatar,hemi,sun);}avatar.position.fromArray(state.position);avatar.rotation.fromArray(state.rotation);state.bones.forEach(function(v){var b=avatar.getObjectByName(v[0]);if(b){b.position.fromArray(v[1]);b.quaternion.fromArray(v[2]);b.scale.fromArray(v[3]);}});var cam=mapEditor.debug.camera;cam.position.fromArray(state.cameraPosition);cam.quaternion.fromArray(state.cameraQuaternion);cam.projectionMatrix.fromArray(state.projection);cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();cam.updateMatrixWorld(true);mapEditor.debug.controls.target.fromArray(state.target);var p=parent.__world.P.pos;near=Math.hypot(p.x-8,p.z-125)<3.5;document.getElementById('sceneExit').hidden=!near;};
['keydown','keyup'].forEach(function(type){window.addEventListener(type,function(e){if(!parent.__landSceneActive)return;if(type==='keydown'&&e.code==='KeyE'&&near){e.preventDefault();e.stopImmediatePropagation();exit();return;}parent.dispatchEvent(new parent.KeyboardEvent(type,{key:e.key,code:e.code,keyCode:e.keyCode,which:e.which,shiftKey:e.shiftKey,ctrlKey:e.ctrlKey,bubbles:true}));e.preventDefault();e.stopImmediatePropagation();},true);});
['pointerdown','pointermove','pointerup','pointercancel'].forEach(function(type){window.addEventListener(type,function(e){if(!parent.__landSceneActive||e.target.id==='sceneExit')return;parent.document.getElementById('c').dispatchEvent(new parent.PointerEvent(type,{clientX:e.clientX,clientY:e.clientY,pointerId:e.pointerId,pointerType:e.pointerType,buttons:e.buttons,button:e.button,movementX:e.movementX,movementY:e.movementY,bubbles:true}));e.stopImmediatePropagation();},true);});window.addEventListener('wheel',function(e){parent.document.getElementById('c').dispatchEvent(new parent.WheelEvent('wheel',{deltaY:e.deltaY,clientX:e.clientX,clientY:e.clientY,bubbles:true}));e.preventDefault();},{passive:false});
var timer=setInterval(function(){if(!window.__mapReady)return;clearInterval(timer);ready=true;mapEditor.orbit();mapEditor.debug.controls.enabled=false;parent.postMessage({type:'land-ready',counts:mapEditor.report().counts,prebuilt:mapEditor.report().prebuilt},'*');if(parent.__landSceneActive)begin();},100);
})();
</script>

<script>
(function(){
var speed=document.getElementById('landSpeed');speed.value=parent.__world.landTimeScale();document.getElementById('landSpeedValue').textContent=speed.value+'×';speed.oninput=function(){var el=parent.document.getElementById('timeScale');el.value=this.value;el.dispatchEvent(new Event('input'));document.getElementById('landSpeedValue').textContent=this.value+'×';};var menu=document.getElementById('landTools');document.getElementById('landToggle').onclick=function(){menu.hidden=!menu.hidden;if(document.pointerLockElement)document.exitPointerLock();};

var ready=false,near=false;setInterval(function(){if(!window.__mapReady)return;if(!ready){ready=true;var T=window.__landThree,gate=new T.Group(),mat=new T.MeshStandardMaterial({color:0x667d7a,roughness:.9}),glow=new T.MeshBasicMaterial({color:0x79f1ec});function box(w,h,d,x,y,z,m){var p=new T.Mesh(new T.BoxGeometry(w,h,d),m);p.position.set(x,y,z);gate.add(p);}box(.45,3.5,.55,-1,1.75,0,mat);box(.45,3.5,.55,1,1.75,0,mat);box(2.6,.5,.65,0,3.65,0,mat);for(var i=0;i<7;i++)for(var sign=-1;sign<=1;sign+=2)box(.07,.15,.06,sign, .4+i*.42,-.3,glow);gate.position.set(8,mapEditor.heightAt(8,125),125);mapEditor.debug.scene.add(gate);mapEditor.camera('arrival');parent.postMessage({type:'land-ready',counts:mapEditor.report().counts},'*');if(parent.__landSceneActive)mapEditor.walk({x:8,z:119,yaw:0});}

</script><script>(function(){var avatar=null,T=null;window.__landAvatarUpdate=function(dt){if(!parent.__world||!window.mapEditor)return;T=window.__landThree;if(!avatar){avatar=new T.ObjectLoader().parse(parent.__world.landAvatarData());avatar.traverse(function(o){if(o.isMesh){o.visible=true;o.castShadow=true;o.frustumCulled=false;}});avatar.rotation.y=Math.PI;var hemi=new T.HemisphereLight(0xe9f4ff,0x82925c,1.1);var sun=new T.DirectionalLight(0xffedcf,1.5);sun.position.set(-20,45,20);mapEditor.debug.scene.add(hemi,sun,avatar);}var p=mapEditor.player();avatar.visible=p.x!=null;if(!avatar.visible)return;avatar.position.set(p.x,p.y,p.z);if(p.speed>.1){var old=avatar.userData.last;if(old&&Math.hypot(p.x-old.x,p.z-old.z)>.001)avatar.rotation.y=Math.atan2(p.x-old.x,p.z-old.z);}avatar.userData.last={x:p.x,z:p.z};var pose=parent.__world.landAvatarPose(p.speed,p.grounded,dt);pose.forEach(function(v){var bone=avatar.getObjectByName(v[0]);if(bone){bone.position.fromArray(v[1]);bone.quaternion.fromArray(v[2]);bone.scale.fromArray(v[3]);}});if(p.mode!=='walk')return;var cam=mapEditor.debug.camera,dist=4.8;cam.position.set(p.x+Math.sin(p.yaw)*dist,p.y+3.2,p.z+Math.cos(p.yaw)*dist);cam.position.y=Math.max(cam.position.y,mapEditor.heightAt(cam.position.x,cam.position.z)+.7);cam.lookAt(p.x,p.y+1.35,p.z);};})();</script>

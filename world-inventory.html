<script>
(function(){
  var MODS = [
    ['world','世界与关卡','地形、房子、街区、门、物件、光照'],
    ['player','角色与移动','速度、跳跃、攀爬、贴脚、转身、动画'],
    ['camera','视角与相机','四档视角、等距、缩放、遮挡'],
    ['input','操作与输入','键鼠、摇杆、手势、快捷键'],
    ['ui','界面与设置','面板、按钮、提示、HUD'],
    ['audio','声音','脚步、环境音、界面音、解锁'],
    ['perf','性能与省电','自适应分辨率、待机、后台'],
    ['eng','工程与验证','单文件、自检、测试、发版']
  ];
  var STATUS = {ok:'能用', wip:'缺一块', todo:'没做', removed:'已删'};
  var PLAT = {both:'双端', desktop:'桌面', mobile:'手机'};

  var raw = document.getElementById('data').textContent.trim().split('\n');
  var rows = [];
  for (var i=0;i<raw.length;i++){
    var t = raw[i].trim();
    if(!t) continue;
    var p = t.split('\t');
    if(p.length < 8) continue;
    rows.push({m:p[0].trim(), f:p[1].trim(), d:p[2].trim(), v:p[3].trim(),
               s:p[4].trim(), plat:p[5].trim(), date:p[6].trim(), kw:p[7].trim()});
  }
  document.getElementById('total').textContent = rows.length;
  document.getElementById('total').textContent = rows.length;

  // 模块导航
  var nav = document.getElementById('nav');
  var counts = {};
  for (var i=0;i<rows.length;i++) counts[rows[i].m] = (counts[rows[i].m]||0)+1;
  for (var i=0;i<MODS.length;i++){
    var a = document.createElement('a');
    a.href = '#m-' + MODS[i][0];
    a.innerHTML = MODS[i][1] + ' <b>' + (counts[MODS[i][0]]||0) + '</b>';
    nav.appendChild(a);
  }

  var state = {f:'all', q:''};

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(s, q){
    s = esc(s);
    if(!q) return s;
    try{
      var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi');
      return s.replace(re,'<mark>$1</mark>');
    }catch(e){ return s; }
  }

  function render(){
    var q = state.q.toLowerCase();
    var out = document.getElementById('out');
    var html = '', shown = 0;

    for (var i=0;i<MODS.length;i++){
      var id = MODS[i][0];
      var list = [];
      for (var j=0;j<rows.length;j++){
        var r = rows[j];
        if (r.m !== id) continue;
        if (state.f !== 'all'){
          if (state.f === 'desktop' || state.f === 'mobile'){ if (r.plat !== state.f) continue; }
          else if (r.s !== state.f) continue;
        }
        if (q){
          var hay = (r.f + ' ' + r.d + ' ' + r.kw + ' ' + r.v).toLowerCase();
          if (hay.indexOf(q) < 0) continue;
        }
        list.push(r);
      }
      if (!list.length) continue;
      shown += list.length;

      html += '<h2 id="m-'+id+'">' + MODS[i][1] + '<span>' + MODS[i][2] + ' · ' + list.length + ' 条</span></h2>';
      html += '<table><thead><tr><th style="width:150px">功能</th><th>说明</th>'
            + '<th style="width:88px">版本</th><th style="width:64px">平台</th>'
            + '<th style="width:76px">状态</th></tr></thead><tbody>';
      for (var k=0;k<list.length;k++){
        var r = list[k];
        html += '<tr><td class="f">' + hl(r.f,q) + '</td>'
              + '<td class="d">' + hl(r.d,q) + '</td>'
              + '<td class="v">' + r.v + '</td>'
              + '<td class="p">' + (PLAT[r.plat]||r.plat) + '</td>'
              + '<td class="s"><span class="pill ' + r.s + '">' + (STATUS[r.s]||r.s) + '</span></td></tr>';
      }
      html += '</tbody></table>';
    }

    out.innerHTML = html || '<p class="empty">没有匹配的条目</p>';
    document.getElementById('stat').textContent = shown + ' / ' + rows.length + ' 条';
  }

  var chips = document.querySelectorAll('.chip');
  for (var i=0;i<chips.length;i++){
    chips[i].onclick = function(){
      for (var j=0;j<chips.length;j++) chips[j].classList.remove('on');
      this.classList.add('on');
      state.f = this.dataset.f;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  }
  document.getElementById('q').oninput = function(){ state.q = this.value.trim(); render(); };

  render();
})();
</script>
